# Served by nginx-unprivileged (port 8080). csp.inc is generated at start by 15-csp.sh.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # robots.txt and sitemap.xml: explicit types (sitemap is served as text/xml like Vite preview).
  location = /robots.txt {
    default_type text/plain;
    include /etc/nginx/conf.d/csp.inc;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    default_type text/xml;
    include /etc/nginx/conf.d/csp.inc;
    try_files $uri =404;
  }

  # Hashed build assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/csp.inc;
    try_files $uri =404;
  }

  # SPA fallback: deep links (/tickets/1, /help, ...) return index.html.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/csp.inc;
    try_files $uri $uri/ /index.html;
  }
}
