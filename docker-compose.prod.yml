# Production-like stack built from the Dockerfiles (no bind mounts, no hot reload).
# Run it on its own; it does not use docker-compose.yml or docker-compose.override.yml:
#   docker compose -f docker-compose.prod.yml up --build
# VITE_API_URL is baked into the web bundle at build time: it must be the address the
# BROWSER uses to reach the API.
services:
  db:
    image: mysql:8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-helpdesk}
      MYSQL_USER: ${DB_USER:-helpdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:-helpdesk}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: helpdesk-api:local
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      DB_NAME: ${DB_NAME:-helpdesk}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_ANALYTICS_ENABLED: ${VITE_ANALYTICS_ENABLED:-true}
    image: helpdesk-web:local
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      CSP_ENABLED: ${CSP_ENABLED:-false}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
    ports:
      - '${WEB_PORT:-5173}:8080'
    depends_on:
      - api

volumes:
  db_data:
  uploads_data:
