name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel stale runs of the same ref (new push to a PR, etc.).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Install -> lint -> build, one job per workspace, run in parallel.
  # Later tasks extend this file: MySQL service + health check (T8.2) in the
  # api job, a docker build job (T8.3), a commented e2e job (T8.4).
  build:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build -w apps/${{ matrix.workspace }}
