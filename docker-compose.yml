services:
  db:
    image: mysql:8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-helpdesk}
      MYSQL_USER: ${DB_USER:-helpdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:-helpdesk}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    image: node:20
    working_dir: /app
    command:
      - sh
      - -c
      - npm install && npm run start:dev -w apps/api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      DB_NAME: ${DB_NAME:-helpdesk}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PORT: ${PORT:-3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # Placeholder command until T0.4 (Vite): then use `npm run dev -w apps/web -- --host`.
  web:
    image: node:20
    working_dir: /app
    command:
      - sh
      - -c
      - echo "web placeholder - Vite arrives in T0.4" && tail -f /dev/null
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  db_data:
  node_modules:
